name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Lets the workflow be run by hand against any branch, which is useful for
  # exercising it before it exists on main.
  workflow_dispatch:

jobs:
  clients:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Required to merge. These are the checks named in the "Protect main"
        # ruleset, so a failure here blocks the pull request.
        platform:
          - adam
          - apple2
          - atari
          - coco
          - msdos

        # Built for visibility but not required to merge, so a failure here
        # does not block. Promote one by adding it to the list above AND to
        # the ruleset's required status checks.
        include:
          - platform: c64

          # z88dk cannot parse the library header:
          #   fujinet-fuji.h:309: Cannot parse function argument 'NewDisk'
          - platform: adam_cpm
            allow_failure: true

          # Cannot pass yet: fujinet-lib ships no msxrom build, and there is
          # no port behind it either (no src/msxrom, no include/msxrom).
          - platform: msxrom
            allow_failure: true

    # Keeps a known-broken platform from reddening the whole run. Its real
    # status is still visible on the job itself.
    continue-on-error: ${{ matrix.allow_failure || false }}

    container:
      image: fozztexx/defoogi:1.4.7

    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: clients
        run: make ${{ matrix.platform }}/r2r

      - name: Upload artifact for ${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: clients/r2r/${{ matrix.platform }}/**

  # Trees outside clients/ whose toolchains are not in the defoogi image yet.
  # Not required to merge and expected to fail for now - they are here for
  # visibility, and should start passing once the toolchains land in
  # mekkogx/defoogi.
  #
  # Each also has a developer's absolute home directory hardcoded in its
  # Makefile, which has to be parameterized before it can build anywhere else:
  #
  #   atari-2600  FN2600="/home/wario/Workspace/fujinet-firmware/pico/atari-2600"
  #   coleco      make -C /home/wario/Workspace/fujinet-lib-experimental
  #   intv        intybasic lobby.bas lobby.asm /home/wario/Workspace/IntyBASIC/intybasic/
  #
  # atari-2600 additionally needs Macroassembler AS, and intv needs intybasic.
  extra:
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        target:
          - atari-2600
          - coleco
          - intv

    container:
      image: fozztexx/defoogi:1.4.7

    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: ${{ matrix.target }}
        run: make

