name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  clients:
    name: clients (${{ matrix.platform }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - adam
          - adam_cpm
          - apple2
          - atari
          - c64
          - coco
          - msdos
          - msxrom

    continue-on-error: true

    container:
      image: fozztexx/defoogi:1.4.7

    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: clients
        run: make ${{ matrix.platform }}/r2r

      - name: Upload artifact for ${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: clients/r2r/${{ matrix.platform }}/**

  # Trees outside clients/, built for visibility.
  extra:
    name: extra (${{ matrix.target }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - atari-2600
          - coleco
          - intv

    continue-on-error: true

    container:
      image: fozztexx/defoogi:1.4.7

    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: ${{ matrix.target }}
        run: make

  # The Master System client links fujinet-lib-experimental's sms target,
  # which the container does not carry; build it from the branch the client
  # tracks. The container's z88dk (with +sms) lives under /usr/local/share.
  sms:
    name: extra (sms)
    runs-on: ubuntu-latest

    continue-on-error: true

    container:
      image: fozztexx/defoogi:1.4.7

    steps:
      - uses: actions/checkout@v4

      - name: Fetch fujinet-lib-experimental
        run: git clone --depth 1 --branch add-sms https://github.com/tschak909/fujinet-lib-experimental.git "$RUNNER_TEMP/fnlib"

      - name: Build
        working-directory: sms
        run: make FNLIB="$RUNNER_TEMP/fnlib" Z88DK=/usr/local/share/z88dk

      - name: Upload artifact for sms
        uses: actions/upload-artifact@v4
        with:
          name: sms
          path: sms/build/lobby.sms
